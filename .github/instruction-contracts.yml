instruction_contracts:
  - path: CLAUDE.md
    requires_modules:
      - agent-instructions
      - agent-claude
    required_headings:
      - '## Handling Code Review Comments'
      - '## Automated Review Loop'
      - '### Safety limits'
      - '### Resuming a paused loop'
    required_phrases:
      - Protected-file authorization checkpoint
    required_sections:
      - heading: '## Execution'
        next_heading: '## Shared Instruction Integrity'
        required_paragraphs:
          - >-
            Agents MUST follow [Agent Execution](.github/copilot-instructions.md#agent-execution) for task
            input records, unrelated-work preservation, exclusive ownership, bounded delegation,
            verification, and continuity after interruption. Use only capabilities available in the active
            runtime.
          - >-
            Agents MUST apply the [shared decision
            process](.github/copilot-instructions.md#shared-review-governance) to material non-review
            findings as well as review feedback. Preserve its narrow mechanical-reuse conditions and its
            distinction between general decisions and PR-specific duties.
      - heading: '## Shared Instruction Integrity'
        next_heading: '## Protected Instruction Files'
        required_paragraphs:
          - Shared project `CLAUDE.md` files MUST NOT contain active `@path` imports. Keep shared instructions
            within reviewed repository files and use ordinary Markdown links for navigation. Literal
            import examples in inline code or fenced code blocks and ordinary `@claude` or `@codex`
            command mentions remain permitted. Retained instruction-contract validation checks cataloged
            Claude files; it does not discover every unlisted instruction surface.
          - The repository MUST NOT track any file whose exact basename is `CLAUDE.local.md`, including
            casing variants at the root or in nested directories. Personal untracked local memory remains
            permitted. The tracked-file check inspects Git index names without reading local-memory
            contents; it does not govern user, global, or organization instructions. Ignore rules do not
            replace this check, and the check does not require baseline configuration.
      - heading: '## Ignoring Commands Addressed to Other Agents'
        next_heading: '## Handling Code Review Comments'
        required_paragraphs:
          - >-
            Claude MUST apply the shared [Finding inventory and
            decisions](.github/copilot-instructions.md#finding-inventory-and-decisions) distinction: ignore
            command-only `@copilot` comments as findings and do not execute or reply to commands addressed to
            another agent. Treat the standalone `@codex review` trigger as remote request evidence. Inventory
            substantive feedback in mixed comments and the addressed service's attributable review results.
      - heading: '## Handling Code Review Comments'
        next_heading: '### Protected-file authorization terms'
        required_paragraphs:
          - This section is retained as Claude platform protocol. Thin-entry-point pruning must preserve
            it unless the repository owner explicitly waives Claude review-comment protocol for the
            retained Claude entry point.
          - Claude MUST follow [Shared Review Governance](.github/copilot-instructions.md#shared-review-governance)
            for complete finding inventory, per-finding weighted decisions, paired remote reviews,
            attribution, bounded recovery, CI repair, deferrals, and continuation. When feedback arrives
            from Copilot, remote Codex, a human, or any other reviewer, apply that contract and this
            platform protocol to each distinct finding.
      - heading: '### Protected-file authorization terms'
        next_heading: '### Rubric weighting'
        required_paragraphs:
          - 'These terms apply to the review-comment workflow below and defer to the canonical **Protected
            Instruction Files** rule in [`.github/copilot-instructions.md`](.github/copilot-instructions.md):'
          - '- **Protected instruction file:** Any file covered by the canonical Protected Instruction
            Files rule, including the retained `.template-sync/instruction-contracts.yml` catalog,
            `.github/copilot-instructions.md`, the root agent entry points (`.hermes.md`,
            `AGENTS.md`, `CLAUDE.md`, `GEMINI.md`), files under `.github/instructions/`, and files
            under `.cursor/rules/`.'
          - '- **Explicit protected-file authorization:** A direct maintainer or owner instruction
            in the current task authorizing the specific protected instruction-file change, either
            by naming the file or by clearly bounding the protected-file change set. The following
            are not sufficient on their own: a PR existing, a review comment existing, a generic "address
            the feedback" request, a reusable prompt, an automated review loop or active review workflow,
            or generic branch-placement authorization.'
          - '- **Already in the PR''s scope:** The protected file appears in the PR''s changed-files
            list or diff against its base branch before the review-driven edit under consideration.
            This is relevant context, not authorization.'
          - '- **Newly introduced protected file:** A protected file the PR did not modify before
            the review-driven edit. Introducing one exceeds any authorization scoped to the PR''s
            existing changes and requires the narrow authorization question in step 7.'
          - '- **Within the already-authorized scope:** An edit that resolves the reviewer''s comment
            without expanding the protected file''s changes beyond the specific protected-file change
            the maintainer already explicitly authorized for this task. A larger or more structural
            change, or one that newly introduces a protected file, exceeds the already-authorized
            scope.'
          - '- **Secondary style-guide recommendation:** A step-8 recommendation to update a style
            guide to prevent similar issues in the future, distinct from the selected step-7 fix for
            the current review comment.'
          - 1. **Signal processing.** Inspect the runtime's actual capabilities. When review-comment
            reactions are supported, add the literal API reaction `eyes` when work begins and remove
            it after completion or evidence-backed refutation. Do not assume a fixed MCP tool inventory;
            use supported equivalent tools. If reactions are unavailable, skip them silently.
          - 2. **Validate the concern.** Determine whether the reviewer's feedback identifies a genuine
            gap, bug, style violation, or improvement opportunity. If the concern is not valid, explain
            why in a reply, skip steps 3-8, and continue to step 9 to complete any required thread
            resolution and cleanup.
          - 3. **List options.** Address each reviewer concern **one at a time**. For each concern,
            think hard about possible ways to resolve the problem or address the feedback and enumerate
            all **materially distinct reasonable options**. Where appropriate, consult vendor or official
            documentation (for example, language, framework, cloud-provider, API, or tooling docs)
            so the option set reflects current authoritative guidance, not just generalized prior
            knowledge. If documentation materially informs the option set or scoring, name or cite
            the source in the evaluation reply. Where it would materially change the outcome, consider
            permutations and combinations of base options (for example, "Option A plus a narrowed
            part of Option C") rather than treating only mutually exclusive base options. Take the
            time needed to reach a defensibly complete list before scoring, while collapsing duplicate
            or materially equivalent options.
          - '4. **Build an evaluation rubric.** Define and display a fresh weighted rubric with 4–6
            scoring criteria relevant to the concern (for example, style-guide compliance, correctness,
            security, performance, maintainability, code simplicity, PII safety, PS 5.1 compatibility,
            test reliability, user impact, backward compatibility, or long-term clarity). Finish the
            options before defining the rubric. Display criteria, weights, and their rationale before
            scoring each criterion on a 1–5 scale. Apply Rubric weighting below. Take the time needed
            to ensure the rubric is **comprehensive and defensible**: each criterion should be one
            a reasonable maintainer would accept as relevant, and the criteria collectively should
            cover the substantive technical considerations of the concern, not just surface-level
            ones.'
          - 5. **Score and select.** Apply the rubric to every option, taking the time needed to score
            each criterion defensibly. Present the results in a Markdown table. Display each criterion's
            weight and every option's checked weighted total before selection. Select the highest-supported
            eligible option; use the shared technical-tie rule when necessary. When the rubric produces
            a clear highest-scoring option, the agent **MUST** select that option and carry it forward
            to step 7, unless an escalation condition under the **Operationalized escalation gate**
            in Escalation protocol below applies. The conditions defined in the **Operationalized
            escalation gate** continue to operate against weighted totals when weighting is applied.
            A topic touching owner preferences, governance, or policy is not, by itself, an escalation
            trigger when the rubric produces a clear winner; this clarification stands independently
            of the protected-file authorization checkpoint in step 7.
          - 6. **Post the evaluation.** Before editing, publish the complete shared finding evaluation
            with options, fresh rubric, score table, selected action, references, tests, and intended
            placement. After implementation, reply with the resulting PR-head SHA and validation evidence.
          - 7. **Implement the fix.** Apply the selected option, commit, and push. Apply the Protected
            content and placement section below before editing or placing the fix.
          - >-
            8. **Evaluate style guide impact.** Read the full applicable guide and follow
            the shared prevention and deferral rules. Implement a secondary guide change
            when explicit current-task authority covers it. Otherwise, post the required
            ready-to-file fenced prompt. For a GitHub inline finding, use the same native
            review thread. For a GitHub body-only finding, use a standalone PR comment
            that records its synthetic finding key, source review identity, reviewed
            commit, and location when available. Record the prompt comment's native
            identity, keep the guide action pending until attributable disposition, and
            continue independent authorized work.
          - 9. **Resolve or leave open.** Reply with the fix or refutation evidence and close a complete
            finding when no guide action remains pending. For body-only findings, record an attributable
            disposition. Inspect the runtime's actual reaction and thread-resolution capabilities;
            retrieve the GraphQL thread ID through an authenticated equivalent when needed. If resolution
            is unavailable, state the manual owner action and leave it incomplete. Remove the temporary
            `eyes` reaction when supported. A resolved flag alone is not proof that the finding is
            complete.
      - heading: '### Rubric weighting'
        next_heading: '### Escalation protocol'
        required_paragraphs:
          - '**Criterion-weighting guidance.** When the rubric includes either of the following criteria,
            weight them **less than** substantive technical criteria such as correctness, security,
            maintainability, style-guide compliance, compatibility, test reliability, and long-term
            clarity, unless the reviewer''s concern is itself primarily about that criterion:'
          - '- **Difficulty to implement** (effort required, churn introduced, complexity of the change)'
          - '- **Tightness of PR scope** (how narrowly the change stays within the PR''s stated boundary)'
          - These two criteria are legitimate considerations but tend to bias rubrics toward minimal,
            status-quo-preserving options even when a substantively better option exists. Implement
            this de-weighting by assigning these criteria a lower weight multiplier, such as `0.5`
            compared with `1.0` for substantive technical criteria. Keep all criteria scored on the
            same 1-5 scale, and show the weights in the posted rubric so the computation is auditable.
          - 'The PR-scope explicit-boundary escalation under condition (d) of the **Operationalized
            escalation gate** in Escalation protocol below is unchanged: an explicit scope sentence
            in the PR description that the selected fix would directly violate still triggers escalation
            regardless of weighting.'
      - heading: '### Escalation protocol'
        next_heading: '### Protected content and placement'
        required_paragraphs:
          - '**Escalation path:** If one of the escalation conditions (a)-(d) under **Operationalized
            escalation gate** below applies, escalate to the PR owner instead of selecting an option.
            Post a **standalone PR comment** (not a reply to the review thread) containing:'
          - '- A brief summary of the reviewer''s concern and which file/line it applies to'
          - '- The options and scoring tables'
          - '- The specific question the owner needs to answer'
          - '- Instructions: *"Reply to this comment starting with `@claude` followed by your chosen
            option or direction."*'
          - Operational complexity in an already-selected or already-documented fallback path is **not**
            a valid escalation trigger. Escalation remains appropriate only when one of conditions
            (a)-(d) in the **Operationalized escalation gate** below applies. When a documented fallback
            path (such as the GitHub MCP/API file-write path in **Automated Review Loop** step 7 **Push
            mechanism**) already determines what the agent should do, the agent **MUST NOT** post
            owner-decision options — including options that ask the owner to choose between MCP/API
            placement and manual integration — merely because that documented path is more cumbersome
            than the preferred mechanism. For concrete examples of operational complexity that **do
            not** justify escalation, see the canonical example list in **Automated Review Loop**
            step 7 **Push mechanism** ("Operational complexity is not failure or unavailability").
          - When escalation has been chosen, **PAUSE** processing of this comment until the owner
            responds. Continue processing other independent review comments in the meantime.
          - '**Operationalized escalation gate.** The agent **MUST** select the unique highest-scoring
            option unless at least one of the following conditions applies:'
          - (a) After bounded evidence gathering and the shared technical-tie rule, the remaining
            choice requires an owner preference, new authority, or a material intended-outcome change.
            A tie alone does not trigger escalation; choose the simpler reversible option when the
            remaining options are equally safe and correct.
          - (b) A decisive fact remains unresolved after bounded primary research, focused testing,
            or independent review, and selecting without it would cross a safety or authority boundary.
            A merely missing technical score first requires investigation, not an automatic owner
            question.
          - (c) The decision hinges on a criterion whose scoring requires owner preference, meaning
            a value judgment the agent cannot resolve from repository state, reviewer text, PR text,
            or already-available context, **AND** that criterion is decisive. An owner-preference
            criterion is decisive when changing only that criterion's score by one point in any valid
            direction within the 1-5 score range would change the top-ranked option.
          - (d) The selected fix would directly violate a scope boundary explicitly set by the PR
            description, such as a sentence of the form "this PR will not modify X" where the selected
            fix does modify X.
          - A small score margin is not, by itself, an escalation trigger. A low-margin result may
            prompt the agent to re-check the conditions above; if none applies, the agent **MUST**
            select the rubric winner and proceed.
          - '**Negative cases — DO NOT escalate merely because:**'
          - '- The rubric leader''s margin is small, when none of the escalation conditions above
            applies.'
          - '- The agent feels uncertain even though the rubric has a unique winner. Subjective uncertainty
            is **not** an escalation trigger when the rubric is decisive.'
          - '- The current comment is adjacent to a previously deferred concern, such as the same
            file region or architectural area. **Each comment gets its own rubric; prior deferrals
            do not propagate to related-but-different comments.**'
          - '- The fix touches content from a recent merge or another contributor''s branch. Cross-branch
            content provenance is one criterion among many in the rubric; it does not by itself trigger
            escalation.'
          - '- `AskUserQuestion` or any other interactive prompt tool is technically available and
            feels lightweight. The bar for an interactive prompt is the **same** as the bar for the
            protocol-defined standalone PR-comment escalation; treat it as having a real cost.'
          - '- General advisory text at the same or lower instruction priority, such as "ask first
            if ambiguous or architecturally significant," sounds more permissive than this rule. The
            escalation rule defined here controls whenever both apply.'
          - '- The fix touches an area the PR description does not explicitly forbid modifying. Only
            an *explicit* scope boundary stated in the PR description triggers escalation under (d);
            implicit PR-scope concerns remain one criterion among many in the rubric.'
          - '**Rubric-construction discipline.** Build the rubric **once** with a fixed set of criteria,
            then apply it **once**. Do not re-score with revised criteria mid-deliberation unless
            a **new external information source arrives**, such as a reviewer follow-up, CI failure,
            or newly discovered repository constraint. If, after rubric application, the agent wants
            to add or remove criteria in order to produce a different winner, treat that as analysis
            paralysis: commit to the rubric output and proceed unless one of the escalation conditions
            above applies.'
      - heading: '### Protected content and placement'
        next_heading: '## Automated Review Loop'
        required_paragraphs:
          - '**Protected-file authorization checkpoint.** Before creating, editing, deleting, renaming,
            or otherwise changing any protected instruction file, including a style guide under `.github/instructions/`,
            determine whether explicit protected-file authorization already covers that specific protected-file
            content change in the current task. Keep the selected option fixed while making this authorization
            determination; do not reopen option selection or ask the maintainer to choose among the
            scored options again merely because protected-file authorization is required.'
          - '- If explicit protected-file authorization already covers the change and the edit stays
            within the already-authorized scope, proceed with the selected option under the placement
            rules below.'
          - '- Otherwise, including when no explicit authorization exists, when the intended edit
            exceeds the already-authorized scope, or when the edit would newly introduce a protected
            file the PR did not previously modify, ask one narrow authorization question before editing.
            The question states the selected option, the protected file, the intended change, the
            agent''s recommendation, and, when applicable, that the protected file is already in the
            PR''s scope. During an active automated review loop, raise this question through the loop''s
            existing pause-and-post mechanism as a new pause trigger, then resume only after the maintainer
            authorizes the specific protected-file change.'
          - '- If authorization is declined, record the decision and resolve or leave the review thread
            according to step 9.'
          - This checkpoint governs only authorization to change protected-file content. It does not
            expand any existing loop-scoped authorization for direct PR-head placement, which continues
            to govern only where an authorized commit lands.
          - 'The goal is for the change to become visible on the PR (i.e., reachable from the PR''s
            head ref). If the agent''s current development branch is not the PR head branch, the following
            rules determine how and when that visibility is achieved:'
          - '- **Outside an active automated review loop:** Cross-branch integration onto the PR head
            is a manual owner action. The agent **MUST NOT** push directly to the PR head branch.
            Instead, the agent **MUST** state in its step-6 reply which branch the commit will be
            pushed to and whether a merge or cherry-pick will be required to make it visible on the
            PR.'
          - '- **During an active automated review loop:** The documented Automated Review Loop provides
            loop-scoped authorization for the agent to push fix commits directly onto the PR head
            branch when all of the preconditions in the "Direct PR-head placement during an active
            review loop" paragraph in Automated Review Loop step 7 are satisfied. See that paragraph
            for the full set of required conditions, safety constraints, fallback behavior, and how
            the loop-scoped authorization interacts with generic session-level or harness-injected
            branch-scoping instructions.'
      - heading: '## Automated Review Loop'
        next_heading: '### Loop procedure'
        required_paragraphs:
          - This section is retained as Claude platform protocol. Thin-entry-point pruning must preserve
            it unless the repository owner explicitly waives Claude automated review-loop protocol
            for the retained Claude entry point.
          - When this active session creates a pull request, or a supported runtime route delivers
            a PR-created event or the owner's `@claude start review loop` comment, initiate the following
            cycle. Do not claim automatic wake-up when event routing is unavailable.
      - heading: '### Loop procedure'
        next_heading: '### Polling protocol'
        required_paragraphs:
          - 1. **Request the reviewer pair.** Capture complete native request, review, inline-comment,
            conversation, and relevant-run baselines, the head and material PR description for each
            service. Prefer supported Copilot Balanced selection and accept Lite fallback. Use `request_copilot_review`
            or a supported equivalent; CLI fallback is `gh pr edit PR-NUMBER --add-reviewer '@copilot'`.
            Confirm delivery through fresh authenticated evidence before sending the exact remote
            Codex trigger `@codex review`. Follow the shared serialization and bounded recovery table;
            an accepted request is not completion.
          - 2. **Wait for both reviews (active polling).** Apply the shared independent per-service
            counters, five-observation body limit, attribution, and terminal-failure recovery rules.
            Immediately after requesting the reviews, begin an active poll loop — do **not** rely
            solely on webhook delivery, which may be delayed or never arrive. The poll loop **MUST**
            follow Polling protocol below.
          - 3. **Check review bodies and coverage.** Retrieve both submitted review bodies, suppressed/advisory
            findings, all-state inline threads, and attributable conversation results. Reconcile declared
            counts. Apply the shared five-observation missing-body bound; an unavailable summary is
            not zero findings. Report partial file coverage when known, for example, `Copilot reviewed
            7 of 9 changed files; the remaining files need additional inspection.` Partial coverage
            alone does not require another request.
          - 4. **Check completion.** One zero-comment review does not complete the loop. Require both
            attributable clean reviews on the final unchanged input, complete earlier dispositions,
            successful required CI, and any required independent checks. An acknowledgment, failed
            service, unknown result, timeout, or exhausted retry remains incomplete. Review completion
            grants no new merge authority.
          - 5. **Process each finding.** Follow Handling Code Review Comments and the shared decision
            process for every real finding. A protected-content authorization question pauses only
            the dependent action; continue independent findings and CI repair. Resolve completed threads
            or state the manual action when tooling is absent. Clean up temporary processing reactions.
          - 6. **Handle prevention and deferrals.** Implement guide changes already covered by explicit
            authority. For uncovered changes, post the ready-to-file prompt and narrow question and
            keep that action pending. Apply the shared deferral rules and whole-PR sweep; a guide
            recommendation does not stop independent authorized work.
          - 7. **Re-request review.** Before re-requesting, the agent **MUST** verify that the final
            fix commit(s) for the current round that are intended to land on the PR head are reachable
            from the PR's head ref. The agent **MUST** record those PR-head fix commit SHA(s) after
            any merge, rebase, or cherry-pick that changes commit IDs; intermediate authored commit
            SHA(s) that were superseded by equivalent PR-head commit SHA(s) **MUST NOT** block re-requesting
            review on their own. Apply Direct PR-head placement during an active loop below.
      - heading: '### Polling protocol'
        next_heading: '### Direct PR-head placement during an active loop'
        required_paragraphs:
          - '- **Poll interval.** Wait at least 60 seconds between each poll cycle, including the
            gap between the step 1 recordings and the first poll. Each primary poll observation queries
            both `get_reviews` and `get_review_comments` at most once per source, where one query
            **MAY** consist of the multiple paginated requests required to satisfy **Pagination completeness
            for poll observations** below; bounded retry or replacement observations for failed cycles
            are governed by the poller-liveness requirements under **Safety limits**. The exact mechanism
            used to implement the wait (for example, shell sleep, background task, or equivalent tooling)
            is left to the agent runtime.'
          - '- **Poll mechanism.** The poll cycle **MUST** use authenticated structured GitHub tooling
            for detection, via `get_reviews` and `get_review_comments` or equivalent authenticated
            sources that expose request, tool, authentication, rate-limit, and parse failures distinctly,
            **unless** authenticated structured GitHub tooling is genuinely unavailable in the session,
            in which case the **Ad-hoc HTTP fallback contract** below applies. Examples of authenticated
            structured tooling include GitHub MCP server tools, `gh api`, or equivalent authenticated
            clients with explicit failure reporting. When a shell-based timing mechanism, such as
            a Claude Code Monitor heartbeat, is used for cycle timing, use the **tick-plus-MCP pattern**:
            the timing mechanism emits a heartbeat at the chosen poll interval (at least 60 seconds)
            with no detection logic of its own, and after each tick the agent performs detection via
            authenticated structured tooling. Unauthenticated HTTP requests against `api.github.com`
            or any equivalent external endpoint **MUST NOT** be used as the detection mechanism for
            the poll cycle (the ad-hoc HTTP fallback below is authenticated and is therefore not "unauthenticated").'
          - '- **Pagination completeness for poll observations.** A poll cycle may count as a **confirmed-successful
            no-review poll** only when each no-new-event detection source was queried in a way that
            can observe the newest relevant records for that source. For paginated GitHub review and
            review-comment sources, including `get_reviews`, `get_review_comments`, or equivalent
            authenticated structured sources, the agent **MUST NOT** rely on an arbitrary fixed `page`
            value or any context-efficiency shortcut, such as querying only `perPage=5, page=5`, unless
            the agent can prove that the selected page or window includes the newest relevant records.
            Acceptable approaches include fetching an unpaginated complete result when the tool provides
            one; traversing pages until the newest page is reached when results are returned oldest-first;
            requesting the maximum supported page size to reduce traversal while still verifying that
            the newest relevant records are included; requesting a page or window that the tool or
            API explicitly defines as newest-first; or using authenticated structured query parameters
            that explicitly return the newest matching bot-authored records. If no new event was detected
            and the agent cannot determine that a detection source included the newest relevant records,
            that source is indeterminate: the cycle is a failed cycle, not a confirmed-successful
            no-review poll, the 10-poll timeout counter **MUST NOT** advance for that cycle, and the
            retry-or-pause behavior under **Retry or pause on polling failure** below applies.'
          - '- **Review-head coherence diagnostic.** When a poll cycle does not detect a new Copilot
            review, and the latest visible `copilot-pull-request-reviewer[bot]` review is on a `commit_id`
            older than or different from the request-time PR head SHA recorded in step 1, the agent
            **SHOULD** treat that as a warning sign to re-check pagination completeness or retry or
            replace the observation through an authenticated structured source. This diagnostic **MUST
            NOT** by itself make the cycle a failed cycle when pagination completeness has been established
            and both detection sources successfully report no new event.'
          - '- **Ad-hoc HTTP fallback contract.** If, and only if, authenticated structured GitHub
            tooling is genuinely unavailable in the session, an ad-hoc HTTP poller, such as raw `curl`
            or a custom script, **MAY** be used as a fallback. In that case, the fallback **MUST**:'
          - '1. Send `Authorization: Bearer $TOKEN` or the equivalent authenticated header for the
            target API, where `$TOKEN` is an environment variable holding the credential and the variable
            name is implementation-defined (common GitHub-token names include `$GITHUB_TOKEN`, `$GH_TOKEN`,
            and `$GITHUB_PAT`; choose the name that is already set in the session and verify it is
            non-empty before invoking the request). Do not log or expose the token.'
          - 2. Check the HTTP status code **separately from the response body** so the body remains
            parseable as JSON. A safe pattern is `body_file=$(mktemp "${TMPDIR:-/tmp}/claude-review-body.XXXXXX");
            http_code=$(curl -sS -o "$body_file" -w '%{http_code}' "$URL"); curl_exit=$?; ...; rm
            -f "$body_file"`. The explicit `${TMPDIR:-/tmp}/claude-review-body.XXXXXX` template keeps
            `mktemp` portable across Linux and BSD / macOS (BSD `mktemp` requires a template or `-t`;
            the no-argument form `mktemp` is Linux-only). The `rm -f` **MUST** run on every path that
            exits the helper, including error paths; the cleanup can be guaranteed by wrapping the
            snippet in a subshell `(...)` (the `EXIT` trap inside a subshell is scoped to that subshell
            and won't disturb the caller's), or by saving and restoring any pre-existing `EXIT` handler
            around an explicit `trap` &mdash; **note that `trap '...' EXIT` is process-wide in POSIX
            shells and bash, so setting it inside an ordinary shell function does *not* make it function-local**
            and would still clobber the caller's `EXIT` handler; only subshells provide automatic
            scope isolation. The pattern writes the response body to a unique temp file (avoiding
            overwriting any existing file or leaving sensitive response data behind), uses `-sS` so
            transport / DNS / TLS failures surface visibly while progress noise is suppressed, and
            captures both the curl exit code and the numeric HTTP status code (the latter via command
            substitution, with only the status code reaching stdout). Require **both** `curl_exit
            -eq 0` **and** the captured HTTP status code to be in the `200`–`299` range; treat any
            non-2xx HTTP response — including 3xx redirects, 4xx client errors, and 5xx server errors
            — **and** any non-zero `curl_exit` as a hard error, not as a "no event" reading. (`curl
            --fail` / `--fail-with-body` is **not** sufficient on its own because it only triggers
            on 4xx/5xx and silently passes 3xx responses through. A bare `curl -w '%{http_code}' "$URL"`
            is **not** sufficient either because the status code is appended to stdout *after* the
            response body, which corrupts JSON parsing of the combined output; status code and body
            **MUST** be captured via separate output streams or files, or via an unambiguous delimiter.
            A bare `curl -s` — without the companion `-S` — is **not** sufficient either because it
            silently suppresses non-HTTP failures such as DNS or TLS errors that would otherwise reach
            stderr.)
          - 3. Type-check the parsed response, for example `isinstance(data, list)` for endpoints
            documented to return a list, and raise on type mismatch.
          - 4. Emit a distinguishable error event line on failure, for example `error http=403 cycle=K`
            (where `K` is the cycle-attempt counter introduced in **Poller liveness** below, **not**
            the `Round N` round counter or the `M/10` confirmed-successful counter), so the agent
            can observe the failure. Bare `|| echo "0"` and equivalent constructs that silently coerce
            parse, transport, or authentication failures into a "no event" sentinel are forbidden.
          - '- **Detection criterion.** On each poll, use **both** `get_reviews` **and** `get_review_comments`
            as co-equal detection signals. A new review round is detected when **either** of the following
            is true:'
          - '- `get_reviews` returns a new review authored by `copilot-pull-request-reviewer[bot]`
            with a `submitted_at` timestamp **strictly newer** than the `get_reviews` baseline recorded
            in step 1.'
          - '- `get_review_comments` returns new comments authored by `copilot-pull-request-reviewer[bot]`
            with a `created_at` timestamp **strictly newer** than the `get_review_comments` baseline
            recorded in step 1.'
          - If no baseline exists, a new bot record is a discovery signal only. Check authenticated
            actor, native identity, request linkage, timing, and head before attributing it. Fresh
            inline findings permit immediate work in steps 3 and 5 without waiting for a summary,
            but the full body and both completed reviews remain required. Observe remote Codex through
            its authenticated conversation, review, and run evidence independently.
          - '- **Co-equal discovery and complete observations.** Either successful source can reveal
            a finding for immediate work even when another source fails. It cannot establish a complete
            inventory or clean review by itself. A successful empty observation requires every relevant
            source to be parsed and pagination-complete. If one source is empty and another fails,
            the cycle is indeterminate and uses the bounded observation recovery under Safety limits.'
          - '- **Independent timeouts.** Apply the shared ten-successful-observation limit independently
            to Copilot and remote Codex. Each complete observation without attributable current-input
            completion advances that service''s count, including repeated stale events and observations
            after the other service is clean. Failed observations neither advance nor reset the count.
            At ten, pause that incomplete gate and name the service and evidence. Continue independent
            work; do not report timeout as success.'
          - '- **State tracking (recommended).** On each confirmed-successful no-review poll, update
            a visible progress indicator in the session transcript (for example, a todo-list entry
            such as `"Round N: awaiting SERVICE review, complete pending observation M/10"`) so that
            stalls are observable. Failed cycles use the visible failure lines described under **Safety
            limits** instead of advancing `M`.'
          - '- **On discovery.** Process available findings immediately. Only the shared completion
            contract determines whether both reviews are clean.'
      - heading: '### Direct PR-head placement during an active loop'
        next_heading: '### Safety limits'
        required_paragraphs:
          - >-
            Claude MUST apply [Safe PR-head placement](.github/copilot-instructions.md#safe-pr-head-placement)
            to Git pushes and the API fallback below. The shared procedure does not expand the active-loop
            authorization or relax its preconditions.
          - >-
            Apply the shared [Continuity and
            recovery](.github/copilot-instructions.md#continuity-and-recovery) rule to verified task grants.
            Codex requires an explicit PR-specific task grant for direct placement; Claude's documented
            active-loop grant applies only under its own preconditions. This is an intentional platform policy
            difference, not a transferable grant. Neither placement rule supplies protected-content or merge
            authority.
          - '**Direct PR-head placement during an active review loop.** When the agent''s working
            branch differs from the PR head branch and **all** of the following preconditions are
            satisfied, the agent **MAY** push the current round''s fix commit(s) directly to the PR
            head branch instead of pausing for manual integration:'
          - 1. The review loop is actively running (not paused and not in an out-of-loop context).
          - 2. The PR head branch is in the **same repository** as the agent's working branch (cross-fork
            PRs are excluded).
          - '3. The push is **non-destructive**: the agent **MUST NOT** force-push or rewrite history
            on the PR head branch.'
          - 4. All existing branch protections, required status checks, signing requirements, and
            CI/CD validation rules on the PR head branch continue to be satisfied.
          - 5. The agent retains the fix commit on its own development branch so that every round's
            changes remain in the development branch history as a per-round ledger.
          - '**Source of authorization.** The documented Automated Review Loop in this file provides
            explicit loop-scoped authorization for direct PR-head placement when all five preconditions
            above are satisfied. No additional per-round or per-session approval from the PR owner
            is required when those preconditions hold. This loop-scoped authorization qualifies any
            generic session-level or harness-injected "develop only on branch X" (or equivalently
            worded) instruction for the duration of the active loop, and only when **all** of the
            following hold:'
          - 1. The agent is acting within the documented Automated Review Loop steps,
          - 2. All five preconditions above are satisfied,
          - 3. The PR head branch is the branch the loop is actively reviewing, and
          - 4. No higher-priority platform, organization, repository, branch-protection, or explicit
            owner instruction forbids the push.
          - Outside an active loop, or for any work not driven by the documented loop steps, the generic
            session-level branch-scoping rule continues to apply unchanged and the agent **MUST NOT**
            push directly to the PR head branch (see "Handling Code Review Comments" step 7, "Outside
            an active automated review loop").
          - '**Push mechanism.** When all five direct PR-head placement preconditions above are satisfied,
            the agent **SHOULD** first attempt direct `git push` to the PR head branch. If the direct
            `git push` fails for a local transport, credential, sandbox proxy, or network reason —
            and the failure is **not** a legitimate GitHub policy rejection such as branch protection,
            required signing, restricted pushes, or another higher-priority policy constraint — the
            agent **MUST** then attempt equivalent placement through an available GitHub MCP/API-backed
            file-write tool before treating placement as failed. Example GitHub MCP/API file-write
            capabilities include `push_files` for multi-file changes and `create_or_update_file` for
            single-file changes; equivalent tool names are acceptable because MCP tool namespaces
            vary by runtime. The GitHub MCP/API path is an alternate placement mechanism, **not**
            a bypass: it **MAY** be used only when it can create a non-destructive PR-head commit
            and only when GitHub accepts the update under the same applicable repository permissions,
            branch protections, signing requirements, and policy constraints. When the GitHub MCP/API
            path is used instead of `git push`, the agent **MUST** record the resulting PR-head commit
            SHA(s) returned by the tool for the same reachability check used by the direct-push path,
            and **MUST** make the audit trail explicit in the **Handling Code Review Comments** step
            6 reply or follow-up reply by stating that GitHub MCP/API file-write placement was used
            and by listing both the development-branch SHA(s), when different, and the resulting PR-head
            SHA(s). The audit trail **SHOULD** also include a brief one-line note describing the underlying
            local `git push` failure when that information is readily available (for example, the
            HTTP status code or a short error class such as "sandbox proxy 403" or "transient network
            timeout"), so future debugging can correlate the placement mechanism with the original
            failure. Only after **both** direct `git push` and the available GitHub MCP/API file-write
            path fail, are unavailable, or are disallowed by a legitimate GitHub policy or higher-priority
            instruction does the documented manual-integration fallback below apply.'
          - '**Operational complexity is not failure or unavailability.** Operational complexity of
            the GitHub MCP/API file-write path — such as splitting a round''s fix across multiple
            file-write calls, chunking large file contents to fit local read or payload limits, JSON-encoding
            large payloads, or making repeated single-file update calls — is **not** by itself a "fail
            or unavailable" condition for the purpose of the manual-integration fallback below. The
            agent **MUST NOT** pause the loop or ask the owner to choose between MCP/API placement
            and manual integration while the documented GitHub MCP/API file-write path remains available
            and can safely create the intended non-destructive PR-head commit(s). The agent **MUST**
            continue attempting the MCP/API path until it succeeds, is disallowed by a legitimate
            GitHub policy or higher-priority instruction, or actually fails despite reasonable use
            of the available tooling. If the MCP/API path actually fails, the agent **MUST** record
            the concrete failure mode — for example, API rejection, missing tool capability, payload
            limit that cannot be worked around by splitting or chunking, permission denial, branch-protection
            rejection, required-signing rejection, restricted pushes, or network/service failure —
            so the manual-integration fallback below is invoked only on substantive infeasibility
            rather than on inconvenience. This clarification does not relax any existing safety boundary:
            force-pushes, branch-protection bypass, required-signing bypass, restricted-push bypass,
            and direct PR-head placement outside an active automated review loop remain prohibited.'
          - When direct PR-head placement is used, the agent **MUST** record the resulting PR-head
            commit SHA(s) for the reachability check below. In the reply posted for **Handling Code
            Review Comments** step 6, the agent **MUST** state that it intends to place the fix directly
            on the PR head branch. After the push completes, the agent **MUST** post a follow-up reply
            confirming that the fix was placed directly on the PR head branch and listing the resulting
            PR-head commit SHA(s).
          - '**Fallback.** If any recorded PR-head fix commit for the current round is not reachable
            from the PR head, the agent **MUST NOT** re-request the review; instead it **MUST** pause
            and post a PR comment:'
          - '`Review loop paused: final fix commit(s) <SHA1>, <SHA2>, ... expected on PR head <pr-head-branch>
            are not reachable from that head. Merge or cherry-pick the fix onto <pr-head-branch>,
            record the resulting PR-head SHA(s), then post "@claude resume review loop" to continue.`'
          - 'If the agent intended to use direct PR-head placement during an active review loop but
            any precondition above was not met, the agent **MUST** treat the fix as not yet placed
            on the PR head, **MUST** wait for the fix to be merged or cherry-picked onto `<pr-head-branch>`,
            and **MUST** record the resulting PR-head SHA(s) before re-requesting the review. A local
            `git push` failure for a non-policy local transport, credential, sandbox proxy, or network
            reason does **not** by itself require pausing for manual merge or cherry-pick: the agent
            **MUST** first attempt the available GitHub MCP/API file-write path described in **Push
            mechanism** above. Only when **both** the direct `git push` and the available GitHub MCP/API
            file-write path fail, are unavailable, or are disallowed by a legitimate GitHub policy
            constraint (such as branch protection, required signing, or restricted pushes) does the
            agent treat the fix as not yet placed on the PR head and pause for manual integration
            per this fallback.'
          - 'Manual integration via this fallback applies **only** after the available GitHub MCP/API
            file-write path has actually been attempted and has failed, is unavailable, or is disallowed
            by a legitimate GitHub policy or higher-priority instruction. The agent **MUST NOT** pause
            for manual integration, **MUST NOT** post owner-decision options, and **MUST NOT** ask
            the owner to choose between MCP/API placement and manual integration solely because the
            MCP/API path is more cumbersome than a direct `git push` — that is, for any of the operational-complexity
            reasons enumerated in the canonical example list under **Push mechanism** above ("Operational
            complexity is not failure or unavailability"). Cumbersome is not the same as failed, unavailable,
            or disallowed: per **Push mechanism** above, the agent **MUST** continue attempting the
            MCP/API path under those conditions rather than treat it as a fallback failure. This restriction
            does not weaken any existing safety boundary; force-pushes, branch-protection bypass,
            required-signing bypass, restricted-push bypass, and direct PR-head placement outside
            an active automated review loop remain prohibited.'
          - When all intended fixes are reachable, reconcile older in-flight requests and apply the
            shared input-invalidation rules before returning to step 1. A new head requires both reviews.
            A material description change invalidates affected reviews. An unchanged input permits
            a request only for an evidenced bounded retry; a new round, refutation, status update,
            or resume alone does not justify a duplicate.
      - heading: '### Safety limits'
        next_heading: '### Resuming a paused loop'
        required_paragraphs:
          - '- **Maximum rounds:** 8 review iterations per loop invocation. After the eighth round,
            **PAUSE** regardless of outcome and post:'
          - '`Review loop paused: reached maximum of 8 review rounds. Post "@claude resume review
            loop" to continue.`'
          - '- **Wall-clock timeout:** 6 hours from loop start. If the timeout is reached, **PAUSE**
            and post:'
          - '`Review loop paused: 6-hour timeout reached. Post "@claude resume review loop" to continue.`'
          - '- **Disposition reuse:** Track native IDs, current text, input, and closure evidence.
            Recheck edited findings and applicable fixes. A seen ID or resolved flag does not justify
            skipping a finding.'
          - '- **Active polling required:** Every review-wait cycle **MUST** be driven by the explicit
            timed poll loop described in step 2. Passive waiting for webhook delivery alone is **not**
            permitted — the poll loop ensures that pause and timeout behavior is reached deterministically
            even if webhook delivery does not occur.'
          - '- **Poller liveness.** The poll loop **MUST** distinguish "successfully observed no new
            event" from "could not determine event state," and **MUST** surface the latter as a visible,
            self-describing failure in the session transcript, for example `cycle K failed: reviews
            endpoint returned HTTP 403` (where `K` is the cycle-attempt counter, **not** the `M/10`
            confirmed-successful counter), rather than as a "no event" reading. Parser exceptions,
            tool errors, non-2xx responses, authentication failures, rate-limit responses, and unexpected
            response shapes **MUST NOT** be suppressed into fallback values such as `0` or `[]` unless
            those values are explicitly logged as an error path and the cycle is **not** counted as
            a confirmed-successful no-review poll.'
          - '- **Failed cycles do not consume the timeout.** The 10-poll timeout counter **MUST**
            advance only on confirmed-successful no-review polls. A poll cycle that fails due to parse,
            transport, authentication, rate-limit, tool error, or unexpected response shape **MUST
            NOT** consume one of the 10 timeout attempts.'
          - '- **Retry or pause on polling failure.** When a poll cycle fails, the agent **MUST**
            make a bounded recovery attempt to retry or replace the observation through authenticated
            structured tooling when such tooling is available. **Bound:** at most **one retry per
            failed source** and at most **one replacement observation via an alternate authenticated
            source** within the same failed cycle. Retries and replacements within a failed cycle
            MAY proceed immediately and do **not** require an additional ≥60s gap; they form part
            of the same failed cycle, not a new cycle. If neither retry nor replacement yields a successful
            observation within these bounds, the loop **MUST** trigger a separate polling-failure
            pause event with a self-describing message, for example `Review loop paused: poll cycle
            is failing (last error: HTTP 403 rate-limit). Switch to authenticated structured GitHub
            tooling or fix the poller, then post "@claude resume review loop" to continue.`'
      - heading: '### Resuming a paused loop'
        next_heading: null
        required_paragraphs:
          - When the PR owner posts `@claude resume review loop` through a supported runtime route,
            recover scoped authority, input identities, both service states, finding dispositions,
            fix reachability, and retry counters. Finish authorized paused fixes and reconcile pending
            operations before any new request. The invocation round counter and timeout can reset;
            same-input delivery and service-attempt budgets cannot reset to evade exhaustion. A mention
            or subscription is a wake-up mechanism only when the actual Claude runtime supports it;
            keep the required active poll loop while running.
          - '---'
      - heading: '## Azure DevOps PR Review Protocol'
        next_heading: '## Ignoring Commands Addressed to Other Agents'
        requires_modules:
          - azure-devops-collaboration
        required_paragraphs:
          - This section is retained as Claude host-specific protocol. Thin-entry-point pruning must preserve
            it unless the repository owner explicitly waives Azure DevOps PR review protocol for the retained
            Claude entry point.
          - Use this protocol only for Azure DevOps Services pull requests hosted in Azure Repos. The GitHub
            Copilot review-comment workflow and automated review loop below remain GitHub-hosted-repository
            protocol; do not use the GitHub automated review loop to promise Azure Repos Copilot polling,
            webhook wake-up, or automatic re-review.
          - For broader Azure DevOps Services module setup, validation, security scanning, dependency-update,
            and URL-form guidance, use the durable Azure DevOps Services support guide at `docs/azure-devops-support.md`
            when that guide is retained.
          - '- Azure Repos Copilot code review is a limited public preview for Azure DevOps Services. It
            requires sign-up, organization-level enablement by a Project Collection Administrator, repository-level
            enablement by a repository owner or administrator, and individual-user opt-in through Preview
            features unless the administrator enables it for the organization. It requires Azure billing
            through a subscription linked to the Azure DevOps organization; Azure DevOps review usage does
            not draw down GitHub Copilot plan AI credits. Treat licensing and pricing details as preview-specific
            and documentation-driven, and do not assume GitHub-hosted Copilot review entitlements cover
            Azure Repos review usage.'
          - '- Copilot review is requested manually from the Azure Repos PR Reviewers list by selecting
            **Request** next to **GitHub Copilot**. If Azure DevOps tooling supports reviewer operations,
            Claude MAY inspect or add ordinary reviewers through Azure DevOps Pull Request Reviewers APIs,
            but MUST NOT claim API-triggered Copilot preview review unless the available tooling explicitly
            verifies that behavior.'
          - '- Copilot always leaves a **Comment** review, never approves or requests changes, does not
            satisfy required-reviewer policies, and does not block merging. Copilot does not read replies,
            does not follow up, and does not automatically re-review after new commits; a fresh review requires
            another manual request.'
          - '- Claude has no autonomous Azure DevOps wake-up. Mentions such as `@claude` route Azure DevOps
            comments only when the user''s runtime explicitly forwards them into the active Claude session.'
          - '- When Azure DevOps connector/API tooling is available and safely authenticated, Claude MAY
            inspect PR reviewers, threads, comments, thread status, and PR statuses through Azure DevOps
            REST APIs, and MAY post replies/comments, update thread status, or create PR statuses. When
            tooling is missing or insufficient, state the needed manual owner action instead.'
          - '- Authentication guidance must stay high-level and secure: prefer Microsoft Entra authentication,
            service principals or managed identities for automation, Azure DevOps service connections for
            pipeline scenarios, secure local tool configuration, or environment variables. Treat tokens
            as opaque values, do not decode claims, and never embed PATs, bearer tokens, service connections,
            credential-bearing clone URLs, or secret-like placeholders in repository files, commands, logs,
            or comments.'
  - path: AGENTS.md
    requires_modules:
      - agent-instructions
      - agent-codex
    required_sections:
      - heading: '## Execution'
        next_heading: '## Protected Instruction Files'
        required_paragraphs:
          - >-
            Agents MUST follow [Agent Execution](.github/copilot-instructions.md#agent-execution) for task
            input records, unrelated-work preservation, exclusive ownership, bounded delegation,
            verification, and continuity after interruption. Use only capabilities available in the active
            runtime.
          - >-
            Agents MUST apply the [shared decision
            process](.github/copilot-instructions.md#shared-review-governance) to material non-review
            findings as well as review feedback. Preserve its narrow mechanical-reuse conditions and its
            distinction between general decisions and PR-specific duties.
          - >-
            For runtimes that follow [OpenAI's documented instruction
            discovery](https://learn.chatgpt.com/docs/agent-configuration/agents-md), Codex builds its chain
            at startup. Global guidance precedes project guidance from the root through the launch working
            directory. Each directory contributes at most one file: `AGENTS.override.md`, then `AGENTS.md`,
            then configured fallback names. Deeper guidance takes precedence within its scope, subject to
            higher-priority instructions. Empty files and the configured byte limit affect loading; verify
            the active runtime rather than assuming every file loaded.
          - >-
            Before editing in a deeper directory, Codex MUST perform bounded discovery along the relevant
            file paths and read applicable instructions. Startup discovery does not automatically cover
            every descendant directory. If active guidance is stale, use the runtime's supported refresh;
            the documented CLI procedure is to restart in the target directory. Preserve the shared
            disk-recovery requirements and exact-file rereads after compaction or instruction changes. This
            guidance does not require changing configuration or apply Codex loading semantics to other
            agents.
      - heading: '## GitHub Plugin Usage'
        next_heading: '## Azure DevOps PR Review Protocol'
        required_paragraphs:
          - This section is retained as Codex platform protocol. Thin-entry-point pruning must preserve
            it unless the repository owner explicitly waives Codex GitHub plugin protocol for the retained
            Codex entry point.
          - Codex can use the OpenAI-curated GitHub plugin (`github@openai-curated`) in this repository
            when the user has installed and authorized it. The plugin is the preferred mechanism for any
            operation that touches remote GitHub state.
          - '- **Prefer the GitHub plugin** for GitHub Issues, pull requests, PR comments, review comments,
            labels, reactions, PR creation, branch management on GitHub, and any other read or write against
            remote GitHub state.'
          - '- **`gh` is an optional fallback**, not a prerequisite. Codex MUST NOT treat the absence of
            the `gh` CLI as a blocker when the GitHub plugin can satisfy the same operation. If both are
            available, use the GitHub plugin first and fall back to `gh` only when the plugin lacks a needed
            capability.'
          - '- **Local `git` remains appropriate** for local working-tree operations: inspecting diffs
            (`git diff`, `git log`, `git status`), creating branches, staging, committing, and pushing.
            Use the GitHub plugin for the corresponding remote-side actions (creating PRs, posting comments,
            reading review state).'
          - '- **Before declaring any GitHub operation impossible**, Codex MUST first check whether the
            GitHub plugin exposes a tool that can perform it. Only after the plugin and any documented
            fallback have both been ruled out should Codex report the operation as unavailable.'
          - 'The `.codex/config.toml` file at the repository root declares `[plugins."github@openai-curated"]
            enabled = true` so that trusted Codex checkouts can opt the plugin in by default. Enabling
            the plugin in this file does not, by itself, grant GitHub authorization: actual access still
            depends on the GitHub app/connector installation, the Codex account performing the operation,
            and the repository''s permissions.'
