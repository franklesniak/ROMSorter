# Optional static instruction checks, independent of baseline and Python projects.
name: Instruction Contracts
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    name: Instruction Contracts
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install validator dependencies
        run: python -m pip install PyYAML==6.0.3 jsonschema==4.26.0
      - name: Validate instruction contracts
        run: python .github/scripts/validate_instruction_profile.py
