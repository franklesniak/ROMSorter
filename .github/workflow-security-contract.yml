  .github/workflows/markdownlint.yml:
    events:
      push:
        branches:
          - '**'
      pull_request:
        branches:
          - '**'
    permissions:
      contents: read
    defaults: {}
    env: {}
    jobs:
      markdownlint:
        controls:
          permissions:
            contents: read
          runs-on: ubuntu-latest
        steps:
          - name: Checkout repository
            with:
              persist-credentials: false
            action: actions/checkout
          - name: Setup Node.js
            with:
              node-version: '24'
              cache: npm
              cache-dependency-path: package-lock.json
            action: actions/setup-node
          - name: Install dependencies
            run_sha256: e568f48e4564d1ada4a272f93f6e94a1db7c70212a765c414a6ec92d2a889e21
          - name: Setup Python
            if: "${{\n  github.repository == 'franklesniak/copilot-repo-template' ||\n  (hashFiles('pyproject.toml') != ''\
              \ &&\n  hashFiles('tests/test_materialize_downstream_adoption.py') != '')\n}}"
            with:
              python-version: '3.13'
              cache: pip
            action: actions/setup-python
          - name: Install Python dependencies
            if: "${{\n  github.repository == 'franklesniak/copilot-repo-template' ||\n  (hashFiles('pyproject.toml') != ''\
              \ &&\n  hashFiles('tests/test_materialize_downstream_adoption.py') != '')\n}}"
            run_sha256: eb339bea1e849c914467ba67999f6f044146f7f7ad70bde582844917420d154e
          - name: Install pinned pre-commit runner
            if: ${{ github.repository == 'franklesniak/copilot-repo-template' }}
            run_sha256: 55ad594cb727d927918abbed17d7ea5727821aad76ce2386cd220edac0540668
          - name: Lint materialized generated output (nested Markdown)
            id: lint-generated
            if: "${{\n  hashFiles('pyproject.toml') != '' &&\n  hashFiles('tests/test_materialize_downstream_adoption.py')\
              \ != ''\n}}"
            continue-on-error: true
            run_sha256: dd05815ea25ef134c81a0ee87f7050bbf8df709fcc382a9c15119d4abef0fecd
          - name: Run actual nested Markdown hook regression
            id: test-nested-hook
            if: ${{ github.repository == 'franklesniak/copilot-repo-template' }}
            continue-on-error: true
            run_sha256: 4364c36faaa1aef0ace31664032748097e1432f037ca081e4eff58918567bf3c
          - name: Run markdownlint on outer files
            id: lint-outer
            continue-on-error: true
            run_sha256: 771ae43c4e1d00c1e2b51414a8f0b0c54c6f6df8f05db2a712c8d1ffe8f1e9c2
          - name: Run markdownlint on nested Markdown code fences
            id: lint-nested
            continue-on-error: true
            run_sha256: af92f0d1245dfb101cf31f650a978af740fb086051ec826b1c654093e8aefe7a
          - name: Validate Markdown links
            id: lint-links
            continue-on-error: true
            run_sha256: 745e4a60b95e7481fce0f99610c343c317229cd42fa0a37d9e34e1c8dfaa42db
          - name: Run toolchain EOL regression tests
            id: test-toolchain
            continue-on-error: true
            run_sha256: 53e60898f75182de0b337c47aac7d236f75da7eea1ccfea513df30f508926a57
          - name: Run nested Markdown regression tests
            id: test-nested
            continue-on-error: true
            run_sha256: 9e775f2469f666758da5c2c0a356ed92e4fdf4094dc953b1a70ce275453385f4
          - name: Check source-template regression results
            if: steps.lint-generated.outcome == 'failure' || steps.test-nested-hook.outcome == 'failure'
            run_sha256: 14eb0d9bd49bb8bc296be8588451ffe6c13a1ea0442234987d1eddc43889ae4d
          - name: Check validation results
            if: steps.lint-outer.outcome == 'failure' || steps.lint-nested.outcome == 'failure' || steps.lint-links.outcome
              == 'failure' || steps.test-nested.outcome == 'failure' || steps.test-toolchain.outcome == 'failure'
            run_sha256: 3207fda8e828274127545fc578655eeb4bd26981854e2c24d853da65cdab0a55
  .github/workflows/powershell-ci.yml:
    events:
      push:
        branches:
          - '**'
      pull_request:
        branches:
          - '**'
    permissions:
      contents: read
    defaults: {}
    env: {}
    jobs:
      powershell-lint:
        controls:
          name: Lint (PSScriptAnalyzer)
          permissions:
            contents: read
          env:
            PSSCRIPTANALYZER_GATE_MODE: first-adoption
          runs-on: ubuntu-latest
        steps:
          - name: Checkout repository
            with:
              persist-credentials: false
            action: actions/checkout
          - name: Run PSScriptAnalyzer
            shell: pwsh
            run_sha256: 7a383c8ad5375162d9763d16b8a705f147044487b2f9c73996cc8072eb7d0b16
      test:
        controls:
          name: PowerShell Tests (${{ matrix.os }}, ${{ matrix.shell }})
          permissions:
            contents: read
          defaults:
            run:
              shell: ${{ matrix.shell }}
          env:
            PESTER_TEST_ROOT: tests/
          runs-on: ${{ matrix.os }}
          strategy:
            matrix:
              include:
                - os: ubuntu-latest
                  shell: pwsh
                - os: windows-latest
                  shell: pwsh
                - os: macos-latest
                  shell: pwsh
                - os: windows-latest
                  shell: powershell
        steps:
          - name: Checkout repository
            with:
              persist-credentials: false
            action: actions/checkout
          - name: Verify supported PowerShell host
            run_sha256: 8e3012d2bdf00067f4f26ae7e497b68ae877ea2376130f8ca683090b8d6b777f
          - name: Find Pester test files
            id: find-tests
            run_sha256: 4eac5c6e7dac9cadc1134029410fb31e8469ebfd5711428444701d5f2d090a42
          - name: Install Pester
            if: steps.find-tests.outputs.found == 'true'
            run_sha256: e93a6c0e0717caf1a2722e6237f2f7b18bb6c795c7d17fb0341dae65c1dd0fa3
          - name: Run Pester tests
            if: steps.find-tests.outputs.found == 'true'
            run_sha256: 1143ca84cb9d3abbdef4079da2cbf55e6ae2012d7f902d9f3bdbe6d41dfb169e
          - name: Skip - No Pester tests
            if: steps.find-tests.outputs.found != 'true'
            run_sha256: 4a372ac175a15d7196eb999e0c8e5179fd52c9eb6b0252eec73db86dcf2e2544
