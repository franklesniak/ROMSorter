  .github/workflows/toolchain-eol.yml:
    events:
      schedule:
        - cron: 23 7 1 * *
      workflow_dispatch:
        inputs:
          warning-window-days:
            description: Days before EOL that should fail the check. Leave blank to use the TOOLCHAIN_EOL_WARNING_DAYS default.
            required: false
    permissions:
      contents: read
    defaults: {}
    env:
      NODE_RELEASE_SCHEDULE_URL: https://raw.githubusercontent.com/nodejs/Release/main/schedule.json
      TOOLCHAIN_EOL_WARNING_DAYS: '180'
    jobs:
      node-eol:
        controls:
          name: Node.js EOL
          permissions:
            contents: read
          runs-on: ubuntu-latest
        steps:
          - name: Checkout repository
            with:
              persist-credentials: false
            action: actions/checkout
          - name: Setup Node.js
            with:
              node-version: '24'
              cache: npm
              cache-dependency-path: package-lock.json
            action: actions/setup-node
          - name: Install Node.js dependencies
            run_sha256: e568f48e4564d1ada4a272f93f6e94a1db7c70212a765c414a6ec92d2a889e21
          - name: Check monitored Node.js selectors
            env:
              WARNING_WINDOW_DAYS: ${{ inputs['warning-window-days'] || env.TOOLCHAIN_EOL_WARNING_DAYS }}
            run_sha256: 2c611b71bcfddadc495811fa341a3c1c8818f3f0276e8495018cefb34b449e8a
