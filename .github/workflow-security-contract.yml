version: 1
workflows:
  .github/workflows/copilot-setup-steps.yml:
    events:
      pull_request:
        branches:
          - '**'
      workflow_dispatch: null
    permissions:
      contents: read
    defaults: {}
    env: {}
    jobs:
      copilot-setup-steps:
        controls:
          permissions:
            contents: read
          runs-on: ubuntu-latest
          timeout-minutes: 30
        steps:
          - name: Checkout repository
            with:
              persist-credentials: false
            action: actions/checkout
          - name: Setup Python for retained validation tools
            with:
              python-version: '3.14'
            action: actions/setup-python
          - name: Install shared validator dependencies
            run_sha256: a789f19adf728f77afad280f08cbc2c77514d08e85ec1dfa3d8bfb22a486e165
          - name: Install pre-commit
            shell: python
            run_sha256: 4e102e51f301a44aeecd7ef2a0b785af5b55fac946de50ff0af97b2d0b98d9a7
          - name: Setup Node.js for Markdown
            with:
              node-version: '24'
              cache: npm
              cache-dependency-path: package-lock.json
            action: actions/setup-node
          - name: Install root Markdown dependencies
            run_sha256: e568f48e4564d1ada4a272f93f6e94a1db7c70212a765c414a6ec92d2a889e21
          - name: Verify root Markdown dependencies
            run_sha256: 3ae59cb6aa7db05fee83c7d81ea20bf3e888e3f4f334061790a0051f49fe60cd
          - name: Install PowerShell validation modules
            shell: pwsh
            run_sha256: fb3fe70f1d9bc3bef5712d0907cfed3a29fabfa26ba38950fc143840d379f390
  .github/workflows/instruction-contracts.yml:
    events:
      push: null
      pull_request: null
      workflow_dispatch: null
    permissions:
      contents: read
    defaults: {}
    env: {}
    jobs:
      validate:
        controls:
          name: Instruction Contracts
          permissions:
            contents: read
          runs-on: ubuntu-latest
          timeout-minutes: 10
        steps:
          - name: Checkout repository
            with:
              persist-credentials: false
            action: actions/checkout
          - name: Set up Python
            with:
              python-version: '3.13'
            action: actions/setup-python
          - name: Install validator dependencies
            run_sha256: a789f19adf728f77afad280f08cbc2c77514d08e85ec1dfa3d8bfb22a486e165
          - name: Validate instruction contracts
            run_sha256: ceaf6773a5dbe08c5cb2f00901ac622ff1d36dba6f3457f3172c5c3ef3676073
  .github/workflows/auto-fix-precommit.yml:
    events:
      push:
        branches:
          - copilot/**
    permissions:
      contents: read
    defaults: {}
    env: {}
    concurrency:
      group: auto-fix-precommit-${{ github.ref }}
      cancel-in-progress: false
    jobs:
      fix-preview:
        controls:
          permissions:
            contents: read
          if: github.actor == 'copilot-swe-agent[bot]'
          runs-on: ubuntu-latest
          timeout-minutes: 30
        steps:
          - name: Checkout code
            with:
              ref: ${{ github.sha }}
              persist-credentials: false
            action: actions/checkout
          - name: Set up Python
            with:
              python-version: '3.14'
            action: actions/setup-python
          - name: Setup Node.js for nested Markdown
            with:
              node-version: '24'
              cache: npm
              cache-dependency-path: package-lock.json
            action: actions/setup-node
          - name: Install root Markdown dependencies
            run_sha256: e568f48e4564d1ada4a272f93f6e94a1db7c70212a765c414a6ec92d2a889e21
          - name: Install pre-commit
            shell: python
            run_sha256: 4e102e51f301a44aeecd7ef2a0b785af5b55fac946de50ff0af97b2d0b98d9a7
          - name: Run pre-commit hooks
            id: hooks
            continue-on-error: true
            run_sha256: 3a508515202e1483711ae9e33717698b422ce16d807bfede969024e9bb21813f
          - name: Capture untrusted fix preview
            id: preview
            if: ${{ !cancelled() && (steps.hooks.outcome == 'success' || steps.hooks.outcome == 'failure') }}
            shell: python
            env:
              HOOK_EXIT: ${{ steps.hooks.outputs.exit_code }}
            run_sha256: 839ede9c7ea73d30212f8ea063cc5c41e213614ddc117abbdae6a0e350bebbe1
          - name: Upload untrusted fix preview
            if: ${{ !cancelled() && steps.preview.outcome == 'success' }}
            with:
              name: untrusted-precommit-fix-preview-${{ github.run_id }}-${{ github.run_attempt }}
              path: '${{ runner.temp }}/precommit-fix-preview/tracked.patch

                ${{ runner.temp }}/precommit-fix-preview/status.txt

                ${{ runner.temp }}/precommit-fix-preview/README.txt

                '
              if-no-files-found: error
              retention-days: 3
            action: actions/upload-artifact
          - name: Preserve pre-commit failure
            if: ${{ !cancelled() && steps.hooks.outcome == 'failure' }}
            run_sha256: ed3783be593491be6511f963ec29a422e74ed8d891b2570a61f5ba78e825c4e7
  .github/workflows/check-placeholders.yml:
